    conditions: Awad et al. (2020) OSF data, one complete session per participant (64,988 participants), answers 1 = sacrifice chosen
- id: intro-expert-n
  kind: computation
  passage: In the answers of 294 respondents to a survey on the foundations of consciousness science [@francken2022], third-order terms do not improve held-out prediction and no triplet of answers survives correction for multiple testing, at a sample size that detects an effect of the trolley size with probability 0.29.
  evidence:
    file: simulation/output/results.json
    run_id: analysis
    pointer: /consciousness/positions/respondents_complete
    reported: '294'
    decimals: 0
    units: respondents
    conditions: survey of consciousness science (Francken et al. 2022 OSF data), 11 position questions, endorsement = answer 1 or 2, complete cases
- id: intro-expert-power
  kind: computation
  passage: In the answers of 294 respondents to a survey on the foundations of consciousness science [@francken2022], third-order terms do not improve held-out prediction and no triplet of answers survives correction for multiple testing, at a sample size that detects an effect of the trolley size with probability 0.29.
  evidence:
    file: simulation/output/results.json
    run_id: analysis
    pointer: /consciousness/positions/power/power_at_reference_median
    reported: '0.29'
    decimals: 2
    units: detection probability
    conditions: survey of consciousness science (Francken et al. 2022 OSF data), 11 position questions, endorsement = answer 1 or 2, complete cases; triplet test at alpha 0.05, planted effect equal to the trolley third-order information; median over 8 random triplets
