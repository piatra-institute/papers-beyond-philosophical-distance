- id: illus-triad
  kind: interpretation
  passage: Any two of the three can be held together. All three cannot.
  rationale: With A = pushing is permissible, B = diverting is impermissible and C = (A implies diverting is permissible), each pair has a model and the three together do not; the triad is the implication chain of Section 3.2 with n = 2.
- id: def-commitment
  kind: definition
  passage: A commitment is a subset $C\subseteq\Omega$, the positions that satisfy it.
  rationale: Set-of-models semantics for commitments over a fixed space of complete positions; all later results are stated in it.
- id: def-compatible
  kind: definition
  passage: A finite family of commitments is compatible when some position satisfies all of them, that is, when their intersection is nonempty.
  rationale: Crisp joint compatibility; graded compatibility is outside the scope (stated in the final section).
- id: def-obstruction
  kind: definition
  passage: An obstruction is an incompatible family whose proper subfamilies are all compatible.
  rationale: Minimal incompatible family; equals a minimal unsatisfiable subset when commitments are constraints.
- id: def-order
  kind: definition
  passage: Its obstruction order $\omega(\mathcal C)$, or order for short, is the largest number of members of an obstruction drawn from $\mathcal C$, with $\omega(\mathcal C)=1$ if every finite family from $\mathcal C$ is compatible and $\omega(\mathcal C)=\infty$ if obstructions of every size exist.
  rationale: The paper's name for the Helly number of a class of commitments; coined term declared in metadata.
- id: prop1
  kind: interpretation
  passage: '**Proposition 1** (what a $k$-wise map decides). Every finite family from $\mathcal C$ whose subfamilies of at most $k$ members are compatible is itself compatible if and only if $\omega(\mathcal C)\le k$.'
  rationale: Proved in the passage that follows it (an incompatible family contains an obstruction; an obstruction larger than k passes the k-wise test). Equivalent to the definition of the Helly number.
- id: jaccard-compat
  kind: interpretation
  passage: For a finite $\Omega$, the Jaccard distance $d_J(A,B)=1-|A\cap B|/|A\cup B|$ between two nonempty commitments is smaller than one exactly when they are compatible.
  rationale: 'Elementary: the distance is below one iff the intersection is nonempty; the parity pair with equal distances is checked in the recorded run (tests and /theory/parity_pairs).'
- id: prop2
  kind: interpretation
  passage: '**Proposition 2** (bundling commitments into positions). Let $\mathcal C^{\cap}$ be the class of finite intersections of members of $\mathcal C$, which contains every profile an atlas can describe by conjoining commitments. Then $\omega(\mathcal C^{\cap})=\omega(\mathcal C)$.'
  rationale: Proved in the text by the private-member argument; standard for Helly numbers (Averkov 2013, eq. 3.1); checked by family enumeration for all eight Boolean classes at n = 2 (/theory/bundling).
- id: prop3
  kind: interpretation
  passage: '**Proposition 3** (reading the order from positions). Let $\mathcal C$ contain $\Omega$ and be closed under intersections of arbitrary subfamilies, and let $\mathrm{cl}(A)$ be the intersection of the members of $\mathcal C$ that contain $A$, the smallest such member. Then $\omega(\mathcal C)$ is the largest size of a finite set $F\subseteq\Omega$ with $\bigcap_{p\in F}\mathrm{cl}(F\setminus\{p\})=\varnothing$, and $\omega(\mathcal C)=1$ if no such set exists.'
  rationale: Proved in the text for closure systems, which include every class on a finite domain after adding the whole domain and all intersections (order unchanged by Proposition 2); the infinite-domain counterexample of bounded open intervals shows the hypothesis is needed. Hoffman's characterization for S-convex sets. The search in simulation/atlas/setsys.py implements it and agrees with direct family enumeration on 300 random set systems (tests) and on all 24 small Boolean cases.
- id: prop3-finite
  kind: interpretation
  passage: 'On a finite $\Omega$ the hypothesis costs nothing: adding $\Omega$ and all intersections of members to $\mathcal C$ leaves the order unchanged, by Proposition 2 and because $\Omega$ belongs to no obstruction unless it is empty.'
  rationale: Removing Omega from an incompatible family of two or more members leaves it incompatible, so Omega is in no obstruction of size two or more; {Omega} is an obstruction only if Omega is empty. Finite intersections are all intersections on a finite domain.
- id: product-lemma
  kind: interpretation
  passage: An obstruction therefore lies on one question, and the order of the class is the largest of the orders $\omega(\mathcal S_q)$.
  rationale: A family of single-question commitments is incompatible iff one question's admitted answer sets have empty intersection; verified for products of exclusion and interval classes in the recorded run (/theory/single_issue_and_products).
- id: horn-bound
  kind: interpretation
  passage: A minimal unsatisfiable Horn set therefore has at most one clause per issue and one negative clause, $n+1$ in all.
  rationale: Forward-chaining argument given in the text; the computed Horn orders equal n + 1 for n = 2 to 5 (/theory/boolean).
- id: parity-bound
  kind: interpretation
  passage: At most $n+1$ points of $\{0,1\}^n$ are affinely independent.
  rationale: Standard linear algebra over GF(2); with the preceding affine-independence argument it gives order n + 1, matched by exhaustive computation for n = 2 to 5.
- id: twolit-bound
  kind: interpretation
  passage: The same holds from $\neg x$ to $x$, so every unsatisfiable set of two-literal clauses has an unsatisfiable subset of at most $2n$ clauses.
  rationale: Path-truncation argument given in the text; the computed orders equal 2n for n = 2 to 5 and the double-cycle families are verified obstructions for n up to 10. The bound is also implied by the classification of Abbasizanjani and Kullmann, credited in the text, and Lee (2009) gives the weaker 4n - 2.
- id: mixture
  kind: interpretation
  passage: The order of a union of classes can exceed the orders of its parts.
  rationale: Categorical answers (order 2) and implications (order 1) give order n + 1, proved by the chain and the Horn bound and computed for n = 2 to 5.
- id: occupancy-lower
  kind: interpretation
  passage: 'One direction is immediate: if $G\subseteq S$ is such a set, the regions $\mathrm{conv}(G\setminus\{g\})$ evaluated on $S$ admit exactly $G\setminus\{g\}$, and the $|G|$ of them form an obstruction.'
  rationale: 'Elementary: G in convex position with no other point of S in its hull; the family''s members omit one point each, so every proper subfamily keeps a point and the whole family none.'
- id: occupancy-30
  kind: interpretation
  passage: Any planar map of 30 occupied positions in general position therefore has order at least six for convex commitments.
  rationale: Combines the lower bound just proved with Heule and Scheucher's theorem that 30 points in general position contain an empty convex hexagon.
- id: occupancy-gap
  kind: interpretation
  passage: A family of regions can share points of the plane and no occupied position, which marks a combination that is possible and unoccupied; on a planar map of 30 positions in general position, no check of fewer than six regions at a time can certify all such combinations.
  rationale: Follows from Proposition 1 applied to the class of convex regions evaluated on the occupied positions, whose order is at least six.
- id: prop4
  kind: interpretation
  passage: '**Proposition 4.** If $X$ is closed under a $(k+1)$-ary near-unanimity operation applied issue by issue, every family of categorical answers that is $k$-wise compatible within $X$ is compatible within $X$. For yes/no issues and $k=2$ the converse holds: if $X$ is not closed under majority, some obstruction consists of at least three categorical answers.'
  rationale: Proved in the text from the Baker-Pixley theorem and the closure of two-literal-clause sets under majority; the k = 2 case is checked exhaustively for three issues and on 3,000 random sets for four (/theory/background_logic).
- id: doctrinal
  kind: interpretation
  passage: 'The discursive dilemma of List and Pettit is the smallest case [@list2002]: with $X$ the profiles that satisfy $r\leftrightarrow(p\wedge q)$, the majority of the admissible profiles $(1,1,1)$, $(1,0,0)$ and $(0,1,0)$ is $(1,1,0)$, which is not admissible, and $\{p,q,\neg r\}$ is an obstruction of three categorical answers.'
  rationale: Direct computation from the definition of X; the discursive dilemma is List and Pettit's (2002) generalization of the doctrinal paradox.
- id: z-order
  kind: interpretation
  passage: The number $z$ is the order of the agenda's categorical answers in the sense used here.
  rationale: Identification of Dietrich and List's z (size of the largest minimally inconsistent subset of the agenda) with the obstruction order of the class of the agenda's propositions relative to the logically possible judgment sets.
- id: locality-differs
  kind: interpretation
  passage: 'The chain of the previous section is an obstruction of $n+1$ commitments, so no check of fewer commitments detects it, yet propagation over pairs of issues refutes it: the fact $x_1$ removes the answer no from $x_2$, and so on, until the commitment $\neg x_n$ leaves $x_n$ without an answer.'
  rationale: Arc consistency on the chain empties a domain for every n from 2 to 10 in the recorded run (/theory/witnesses/arc_consistency_chain).
- id: locality-maps
  kind: interpretation
  passage: A pairwise map of questions, such as a correlation network, and a pairwise map of commitments, such as a distance matrix, therefore answer different questions, and an atlas needs to say which kind of locality it relies on.
  rationale: Consequence of the separation shown by the chain (high commitment order, issue-local refutation) and by parity (non-local in both senses).
- id: finite-duality-step
  kind: interpretation
  passage: If it does, the minimal incompatible families form finitely many patterns up to renaming of issues, which in constraint satisfaction is finite duality; conversely, under finite duality every minimal incompatible family is the image of one of finitely many patterns and so has bounded size.
  rationale: 'The paper''s own short argument: obstructions of bounded size over a finite language are finitely many up to isomorphism, and a critical obstruction is a homomorphic image of a member of any complete set of obstructions.'
- id: prop5
  kind: interpretation
  passage: '**Proposition 5** (the pairwise hull). Let $S\subseteq\{0,1\}^n$ be the set of answer profiles observed in a dataset and $H(S)$ the set of profiles each pair of whose answers occurs together in some observed profile. Then $H(S)$ is the smallest set that contains $S$ and is closed under majority. Every distribution whose pairwise tables have the same empty cells as those of the data assigns probability zero outside $H(S)$, and the uniform distribution on $H(S)$ is such a distribution and gives every profile of $H(S)$ positive probability.'
  rationale: Proved in the text from Baker-Pixley, the closure of two-literal-clause sets under majority, and the fact that H(S) and S have the same occurring pairs; the hull identity is checked on all 255 supports over three issues and 3,000 random supports over four and five issues (/theory/pairwise_hull). This is the support-level statement; numerical values are treated by Proposition 6.
- id: prop6
  kind: interpretation
  passage: '**Proposition 6** (what the numerical tables exclude). Let $q$ be the observed distribution, $S$ its support, and $\mathcal F(S)$ the set of profiles to which some distribution with the pairwise tables of $q$ gives positive probability. A profile $z\notin S$ lies in $\mathcal F(S)$ exactly when some signed table $d$ whose pairwise tables vanish is positive at $z$ and nonnegative outside $S$. Hence $\mathcal F(S)$ depends on the data only through $S$, and $S\subseteq\mathcal F(S)\subseteq H(S)$.'
  rationale: 'Proved in the text (perturbation q + t d). Checked in the recorded run: per-profile LPs from the tables of a random distribution on S, one LP from S directly, a second random distribution on S, and the closed form for three issues agree on all 255 and 65,535 supports (/theory/lp_exhaustive). It is the facial set of the observed margins in the sense of Fienberg and Rinaldo (2012).'
- id: lp-duality
  kind: interpretation
  passage: By duality it equals the smallest $\mu\cdot y$ over vectors $y$ for which the pairwise function $f(x)=\phi(x)\cdot y$ is at least one at $z$ and nonnegative on every profile.
  rationale: Linear programming duality for max p(z) subject to p >= 0 and Phi^T p = mu, whose dual is min mu.y subject to Phi y >= e_z (simulation/atlas/lpbounds.py). Every certificate of a zero in the recorded run is checked in exact integer arithmetic after rational rounding.
- id: hull-xor
  kind: interpretation
  passage: If the observed profiles are exactly those with an even number of yes answers, the uniform distribution on them and the uniform distribution on all eight profiles have the same pairwise tables, so $\mathcal F(S)$ contains all eight and no pairwise statistic can show that the four odd profiles never occur.
  rationale: 'Direct check: both distributions have every one-way margin 1/2 and every two-way cell 1/4 (tests/test_atlas.py, test_lp_certifies_exclusions_inside_the_hull: no exclusion, all four odd profiles bounded at 0.25).'
- id: six-profile
  kind: interpretation
  passage: With $T$ the number of yes answers, $(T-1)(T-2)/2$ is a pairwise function equal to one at 000 and 111 and to zero elsewhere, and the tables fix its expectation at zero.
  rationale: (T-1)(T-2)/2 = sum_{i<j} x_i x_j - sum_i x_i + 1, which equals 1 at T in {0, 3} and 0 at T in {1, 2}; its expectation is a linear function of the pairwise tables and vanishes for any distribution on the six profiles with one or two yes answers. The recorded run finds the LP optimum 0 for 000 and 111 with exact certificates (/theory/lp_exhaustive/six_profile_example).
- id: closed-form-n3
  kind: interpretation
  passage: For three answers the signed tables whose pairwise tables vanish are the multiples of the table that is $+1$ on profiles with an even number of yes answers and $-1$ on the others.
  rationale: The pairwise moment map on {0,1}^3 has rank 7, so its kernel is one-dimensional; the parity character has zero sum over every one- and two-way cell. The closed form derived from it agrees with the LP on all 255 supports (/theory/lp_exhaustive/issues_3/closed_form_agrees).
- id: mixing
  kind: interpretation
  passage: 'Third-order structure in population data need not reflect anyone''s commitments: a population that mixes groups with different pairwise structures can show higher-order structure that no group shows.'
  rationale: Mixtures of exponential-family distributions leave the family in general; the trolley analysis therefore stratifies by country and design conditions.
- id: assume-endorse
  kind: assumption
  passage: An answer of 1 or 2 counts as endorsement.
  rationale: Binary coding needed for exact maximum-entropy models over all answer patterns; a finer ordinal model could change the measured structure (stated in the discussion).
- id: assume-session
  kind: assumption
  passage: 'The analysis keeps one complete session per participant, the first in the file in which each case was answered once: 64,988 participants.'
  rationale: Avoids repeated participants across training and test folds; rule implemented in simulation/fetch_data.py and recorded in data/MANIFEST.json.
- id: assume-methods
  kind: assumption
  passage: For each battery, maximum-entropy models of order one (independent answers), two and three were fitted with a quadratic penalty chosen by inner cross-validation, and their held-out log-likelihood was compared over five repetitions of ten-fold cross-validation.
  rationale: Nested cross-validation with the penalty grid 0.001-0.3 (simulation/atlas/empirical.py); a different penalty family could change the size of the third-order loss.
- id: assume-null
  kind: assumption
  passage: Each triplet of answers was also tested for third-order structure by the likelihood-ratio statistic of the model without a three-way interaction, with a null distribution of 9,999 tables simulated from the triplet's marginal under the fitted pairwise model of the whole battery.
  rationale: The marginal of a pairwise model over three items can carry a small three-way term, so the null is simulated from the fitted model; the fitted model is not refitted per simulation. With 9,999 draws the smallest attainable p-value, 1/10,000, lies below the first Benjamini-Hochberg threshold 0.05/165.
- id: assume-screening
  kind: assumption
  passage: The analysis applies the screening of the source study.
  rationale: 'Eligibility follows Francken et al. (2022, Participants): repeat submissions (before = 1) and respondents who did not answer yes to ''Do you study or research consciousness?'' are excluded; the resulting 232 submissions equal the source''s unrestricted eligible sample. The ASSC-only restriction of the source''s main text (166) is not applied.'
- id: assume-cv-variance
  kind: assumption
  passage: Differences between models are reported with the corrected resampled variance of Nadeau and Bengio, which allows for the overlap of training sets across folds and repetitions [@nadeau2003].
  rationale: The correction (1/J + n2/n1) s^2 is a heuristic that assumes a fold-score correlation of n2/(n1 + n2); it replaces the naive s^2/J. Fold counts are reported as descriptive quantities.
- id: assume-power-design
  kind: assumption
  passage: 'The power of this screening was estimated by simulation: a three-way term was planted in the fitted pairwise model of the battery with every one- and two-way margin held fixed, and datasets of the survey''s size drawn from it were analysed exactly as the observed data, from the choice of penalty to the correction for multiple testing.'
  rationale: The planted model is the I-projection of the tilted pairwise model onto the fitted one- and two-way moments (maximum moment error below 1e-7); four random triplets; strength set so that the planted triplet's own third-order information equals each target; one seed per simulated dataset.
- id: interp-trolley-shape
  kind: interpretation
  passage: The pairwise model captures that accepting the Footbridge sacrifice goes with accepting the other two; it underestimates how rarely people accept the Footbridge sacrifice while rejecting both others.
  rationale: Reading of the cell ratios for the patterns 001 (0.734) and 111 and of the negative three-way interaction in the recorded results.
- id: interp-unobserved
  kind: interpretation
  passage: Unobserved groups of respondents, for instance inattentive ones, could still contribute to it.
  rationale: Stratification covers countries and design conditions only; latent groups cannot be excluded with these data.
- id: def-joint-avoidance
  kind: definition
  passage: Call a combination of three answers that never occurs, although each of its three pairs of answers does, a joint avoidance; it is the empirical trace of an obstruction of order three inside the pairwise hull.
  rationale: Coined term; computed by atlas/empirical.py joint_avoidances and compared with simulations from the fitted pairwise model.
- id: interp-survey-null
  kind: interpretation
  passage: The survey thus detects no third-order structure, and it cannot exclude structure of the trolley's strength.
  rationale: Zero discoveries among 165 triplets; every simultaneous 95% interval for the three-way log interaction contains zero and none excludes the trolley magnitude 1.10 (/consciousness/positions/triplet_tests/triplets_excluding_reference_size = 0); the screening discovered a trolley-size effect in 0 of 100 simulated datasets.
- id: interp-undetected
  kind: interpretation
  passage: An effect of the strength found in the trolley judgments would most likely have gone undetected.
  rationale: 'Discovery probability of the full screening at the trolley effect: 0 of 100 simulated datasets (Wilson 95% interval 0 to 0.037); for one pre-specified triplet without correction, 0.24.'
- id: interp-twice
  kind: interpretation
  passage: It reached 80% discovery at about 0.059 bits, more than twice the largest third-order information of any observed triplet.
  rationale: 0.0593 / 0.0265 = 2.24 (/consciousness/positions/discovery_power/bits_for_80pct_discovery and /triplet_tests/max_third_order_bits).
- id: interp-three-times
  kind: interpretation
  passage: With a Bonferroni correction over all triplets the approximation gives 0.0642 bits at the consciousness survey's size, close to the 0.059 bits simulated for the full screening, and 0.0144 bits for the 161,700 triplets of the PhilPapers survey, about three times the trolley effect.
  rationale: 0.0144 / 0.00489 = 2.94; the analytic Bonferroni threshold (0.0642) and the simulated screening threshold (0.059) agree to within 9% at N = 223.
- id: lp-no-exclusion-data
  kind: interpretation
  passage: The pairwise tables exclude no unobserved profile.
  rationale: 'Positions: 1,872 unobserved profiles in the hull, all with positive LP bound; entities: 17, all positive; trolley: all 8 profiles observed (/consciousness/*/lp_bounds, /trolley/lp_bounds).'
- id: maps-differ
  kind: interpretation
  passage: Maps computed from survey answers are a different object, and the theorem about commitments does not license reading compatible combinations off them.
  rationale: The product lemma concerns compatibility of partial assignments on the full product of answer sets; empirical correlations record pairwise tables (Propositions 5 and 6), which leave occupied combinations undetermined, e.g. the even-parity and uniform distributions on three answers.
- id: maps-distance
  kind: interpretation
  passage: 'A matrix of distances between respondents records how many answers two respondents share but not which ones: exchanging the labels of two questions changes which combinations are held without changing any distance.'
  rationale: Hamming distance counts disagreements; it is invariant under any permutation of the questions applied to all respondents, which in general changes the set of held profiles (e.g. {100, 010} and {100, 001}).
- id: assume-design
  kind: assumption
  passage: Questions answered by fewer respondents give less power.
  rationale: The design calculation assumes all 1,785 respondents answer the three questions of a triplet; the survey's optional questions have fewer answers.
- id: normative-record
  kind: normative
  passage: With order two, pairwise compatibility suffices. With order $k$, the atlas has to record compatibility of $k$ commitments at a time, or the commitments themselves together with a decision procedure.
  rationale: 'Recommendation derived from Proposition 1: a map that records less than k-wise compatibility for a class of order k cannot decide joint compatibility for all families.'
- id: scope-crisp
  kind: assumption
  passage: 'The theory concerns crisp compatibility: a family of commitments is compatible or not.'
  rationale: All propositions use set-of-models semantics; credences and graded commitments need a different local-to-global theory.
- id: background-vs-commitment
  kind: interpretation
  passage: What counts as background changes the order. With the implications $x_1\to x_2,\dots,x_{n-1}\to x_n$ as background, the answers $x_1$ and $\neg x_n$ already conflict, an obstruction of two categorical answers; when the implications are themselves commitments under examination, every obstruction contains them, and the chain has $n+1$ members.
  rationale: The chain's implications define a majority-closed set X, so by Proposition 4 categorical answers have order at most two within X; as commitments, the chain is the order-(n+1) obstruction of Section 3.2. Both computations are in the recorded run (/theory/boolean and /theory/witnesses).
- id: interp-by-null
  kind: interpretation
  passage: None of the 165 triplets is a discovery of the screening, and therefore none is a discovery of the variant with lower thresholds either.
  rationale: The screening made 0 discoveries (/consciousness/positions/triplet_tests/discoveries = 0). The variant divides every step-up threshold by sum_{i<=m} 1/i > 1, so the largest rank it rejects is at most the largest rank the step-up procedure rejects; with none rejected by the latter, none is rejected by the former. This is a mechanical fact about the two rules and claims no error-rate guarantee for either.
- id: assume-calibration
  kind: assumption
  passage: The Monte Carlo p-values here are simulated from a penalized pairwise model fitted to the same respondents, and their calibration was not established, so that rate is nominal too.
  rationale: triplet_pvalues in simulation/atlas/empirical.py draws the null tables from the triplet marginals of the penalized pairwise model fitted to the observed respondents (a plug-in parametric bootstrap); validity of these p-values under the null, which Theorem 1.3 of Benjamini and Yekutieli requires, was not shown, so neither procedure's rate is claimed to be controlled.
- id: interp-by-subset
  kind: interpretation
  passage: The variant's thresholds are lower, so it rejects no triplet that the step-up procedure keeps.
  rationale: The step-up rule rejects the hypotheses up to the largest rank i with p_(i) <= i q / m; the variant uses i q / (m sum_{j<=m} 1/j), which is smaller for every i, so its largest qualifying rank is no larger.
- id: interp-null-rate
  kind: interpretation
  passage: Without a planted term, where every discovery is false, it made a discovery in 4 of 100 datasets; this estimates its error rate under the fitted model and guarantees nothing about other distributions.
  rationale: Under the fitted pairwise model every triplet null holds, so any discovery is false and the false discovery proportion is 1 or 0; 4 of 100 datasets (/consciousness/positions/discovery_power/null_any_discovery = 0.04) estimates the false discovery rate of the screening under that one model only. No dependence condition was established, so no guarantee is claimed.
- id: assume-nominal-fdr
  kind: assumption
  passage: The triplet tests share items and respondents, and no such condition was established for them, so the rate is nominal.
  rationale: Overlapping triplets share items and every test uses the same respondents and the same fitted null, so neither independence nor positive regression dependence was shown; the 5% level is nominal.
- id: cov-abs-order2
  kind: definition
  passage: Categorical answers and ranges on ordered scales have order two when every combination of answers is admissible.
  rationale: 'Order two: the product lemma (Section 3.1) with intervals and boxes of order two (Danzer et al. 1963; Amenta et al. 2017), on the full product of answer sets. Recorded: /theory/boolean/rows rows 0-4 (class categorical, n = 1 to 5): order_by_points = 2; /theory/single_issue_and_products/rows (cases ordinal_intervals and product_intervals): order = 2.'
- id: cov-abs-six
  kind: definition
  passage: at least six when evaluated on 30 occupied positions of a planar map
  rationale: 'At least six for thirty occupied positions: by Hoffman''s characterization (occupancy paragraph, Section 3.3) the order of convex regions evaluated on a planar point set equals its largest empty convex polygon, and every 30 points in general position contain an empty hexagon (Heule and Scheucher 2024; claim src-heule). The recorded run checks the characterization on 1,300 random maps of 4 to 16 points (/theory/planar), not the 30-point theorem, which is cited.'
- id: cov-abs-datasets
  kind: definition
  passage: Two public datasets stand in for unreleased PhilPapers responses.
  rationale: 'Two public datasets: the Moral Machine trolley responses (OSF project mxa6z, Awad et al. 2020) and the consciousness-science survey (OSF project xz3ua, Francken et al. 2022), the two sources in simulation/data/MANIFEST.json.'
- id: cov-triad-three
  kind: definition
  passage: Three positions about the trolley cases show the problem this paper studies.
  rationale: 'Worked example: three positions, A, B and C, defined in the next sentence.'
- id: cov-triad-numbers
  kind: definition
  passage: Let $A$ be the view that pushing a man off a footbridge to stop a runaway trolley and save five people is permissible, $B$ the view that diverting the trolley onto a side track, where it kills one person instead of five, is impermissible, and $C$ the principle that if the pushing is permissible, so is the diverting.
  rationale: 'Worked example: five people and one person instead of five are the stipulated numbers of the trolley cases (Foot''s switch case and Thomson''s footbridge case); the incompatibility of A, B and C does not depend on them.'
- id: cov-triad-map
  kind: definition
  passage: A map that records how $A$, $B$ and $C$ relate in pairs, whether by distances, correlations or a graph of compatible pairs, shows three mutually compatible positions and has no place to register that the three exclude each other.
  rationale: 'Worked example: the three positions are pairwise compatible and jointly incompatible (claim illus-triad), so a pairwise record shows three mutually compatible positions.'
- id: cov-intro-order2
  kind: definition
  passage: Profiles of categorical answers and of ranges on ordered scales have order two when every combination of answers is admissible, so checking them in pairs decides their compatibility.
  rationale: 'Order two: the product lemma (Section 3.1) with intervals and boxes of order two (Danzer et al. 1963; Amenta et al. 2017), on the full product of answer sets. Recorded: /theory/boolean/rows rows 0-4 (class categorical, n = 1 to 5): order_by_points = 2; /theory/single_issue_and_products/rows (cases ordinal_intervals and product_intervals): order = 2. Checking in pairs suffices by Proposition 1 with k = 2.'
- id: cov-intro-six
  kind: definition
  passage: at least six when they are evaluated on thirty occupied positions of a planar map in general position
  rationale: 'At least six for thirty occupied positions: by Hoffman''s characterization (occupancy paragraph, Section 3.3) the order of convex regions evaluated on a planar point set equals its largest empty convex polygon, and every 30 points in general position contain an empty hexagon (Heule and Scheucher 2024; claim src-heule). The recorded run checks the characterization on 1,300 random maps of 4 to 16 points (/theory/planar), not the 30-point theorem, which is cited.'
- id: cov-intro-two-classes
  kind: definition
  passage: Two classes of low order, categorical answers and conditional principles, combine to order $n+1$.
  rationale: 'Two classes: categorical answers (order two) and implications (order one); their union has order n + 1 by the chain and the Horn bound (Section 3.2). Recorded: /theory/boolean/rows rows 0-4 (class categorical, n = 1 to 5): order_by_points = 2; /theory/boolean/rows rows 5-9 (class implications_only): order_by_points = 1; /theory/boolean/rows rows 15-19 (class categorical_implications): order_by_points = n + 1.'
- id: cov-intro-two-issues
  kind: definition
  passage: yet propagation over two issues at a time refutes every incompatible family of them
  rationale: 'Two issues at a time: arc consistency on implication chains (Section 4.2); the recorded run confirms that propagation refutes chains on up to 10 issues (/theory/witnesses/arc_consistency_chain).'
- id: cov-intro-datasets
  kind: definition
  passage: The empirical part uses two public datasets, because individual responses to the PhilPapers surveys are not public.
  rationale: 'Two public datasets: the Moral Machine trolley responses (OSF project mxa6z, Awad et al. 2020) and the consciousness-science survey (OSF project xz3ua, Francken et al. 2022), the two sources in simulation/data/MANIFEST.json.'
- id: cov-above-two
  kind: definition
  passage: Above order two, finer pairwise information does not close the gap in general.
  rationale: Order two is the threshold of Proposition 1 for a pairwise record; above it, the parity pair in the next sentences has identical pairwise Jaccard distances and subfamily sizes in a compatible and an incompatible family (/theory/parity_pairs, families of 3 to 12 commitments).
- id: cov-prop3-one
  kind: definition
  passage: If no set $F$ qualifies, there is no obstruction, and the order is one by definition.
  rationale: 'Order one: the convention in the definition of the obstruction order (omega = 1 when every finite family is compatible), Section 2.'
- id: cov-intervals-two
  kind: definition
  passage: Bounded open intervals of the real line have order two, but no nonempty finite set of points has a smallest open interval containing it.
  rationale: 'Order two: Helly''s theorem in dimension one for finite families (Danzer et al. 1963, p. 102), and two disjoint intervals form an obstruction. No smallest interval: an open interval containing a finite set can always be shrunk at either end.'
- id: cov-search-one
  kind: definition
  passage: The largest such $F$ can therefore be found by extending sets of positions one at a time and discarding every set that fails.
  rationale: 'One at a time: the hereditary search justified by the deletion property in the preceding sentence and implemented in simulation/atlas/setsys.py (order_by_points).'
- id: cov-three-cases
  kind: definition
  passage: Three cases cover most survey-based atlases.
  rationale: 'Three cases: categorical answers, ranges on ordinal scales and exclusions on a question, treated in the rest of the paragraph.'
- id: cov-categorical-two
  kind: definition
  passage: A categorical answer, such as "accepts physicalism", excludes every other answer to the same question, two different answers already conflict, and profiles of categorical answers have order two.
  rationale: 'Two different answers to one question are disjoint answer sets and conflict; order two by the product lemma. Recorded: /theory/boolean/rows rows 0-4 (class categorical, n = 1 to 5): order_by_points = 2.'
- id: cov-two-profiles
  kind: definition
  passage: Two partial profiles are compatible exactly when they give different answers to no common question, and a family of profiles is compatible exactly when its members are pairwise compatible.
  rationale: The pairwise case of the product lemma on the full product of answer sets.
- id: cov-impl-one
  kind: definition
  passage: Implications alone never conflict, because the all-yes profile and the all-no profile satisfy every implication $x_i\to x_j$; the order is one.
  rationale: 'Order one: the all-yes profile satisfies every implication, so every finite family is compatible. Recorded: /theory/boolean/rows rows 5-9 (class implications_only): order_by_points = 1.'
- id: cov-horn-one
  kind: definition
  passage: whose clauses contain at most one positive literal
  rationale: 'At most one positive literal: the definition of a Horn clause.'
- id: cov-horn-count
  kind: definition
  passage: A minimal unsatisfiable Horn set therefore has at most one clause per issue and one negative clause, $n+1$ in all.
  rationale: 'Forward-chaining argument of the preceding sentences. Recorded: /theory/boolean/rows rows 20-24 (class horn): order_by_points = n + 1.'
- id: cov-excl-three
  kind: definition
  passage: Categorical answers with exclusions $\neg(x_i\wedge x_j)$ have order three.
  rationale: 'Order three: proved in the next sentence. Recorded: /theory/boolean/rows rows 11-14 (class categorical_exclusions, n = 2 to 5): order_by_points = 3.'
- id: cov-excl-one-negative
  kind: definition
  passage: so a minimal unsatisfiable set consists of one negative clause and the facts it contradicts
  rationale: The only derivations are the facts, so a minimal unsatisfiable set is one negative clause with the one or two facts it contradicts.
- id: cov-gf2
  kind: definition
  passage: over the field with two elements and have order $n+1$
  rationale: 'The field with two elements is GF(2) = {0, 1} with addition modulo 2, over which a parity constraint is an affine equation. Order n + 1 by the affine-independence argument. Recorded: /theory/boolean/rows rows 25-29 (class parity): order_by_points = n + 1.'
- id: cov-two-cycles
  kind: definition
  passage: The $2n$ clauses of the two cycles $x_1\to x_2\to\dots\to x_n\to\neg x_1$ and $\neg x_1\to\neg x_2\to\dots\to\neg x_n\to x_1$ attain the bound.
  rationale: 'Two cycles: the double-cycle family of 2n two-literal clauses; the recorded run confirms it is an obstruction for n up to 10 (/theory/witnesses/double_cycle). Recorded orders: /theory/boolean/rows rows 30-34 (class pairwise_clauses): order_by_points = 2n.'
- id: cov-unrestricted
  kind: definition
  passage: Unrestricted commitments have order $2^n$, attained by the $2^n$ commitments that each exclude one profile; no class over a finite $\Omega$ exceeds $|\Omega|$.
  rationale: 'Each exclude one profile: the complements of the 2^n single profiles form an obstruction, since any 2^n - 1 of them admit the remaining profile. Recorded: /theory/boolean/rows rows 35-38 (class unrestricted): order_by_points = 2^n; /theory/witnesses/unrestricted.'
- id: cov-union
  kind: definition
  passage: Categorical answers have order two and implications order one, but together they have order $n+1$.
  rationale: 'Recorded: /theory/boolean/rows rows 0-4 (class categorical, n = 1 to 5): order_by_points = 2; /theory/boolean/rows rows 5-9 (class implications_only): order_by_points = 1; /theory/boolean/rows rows 15-19 (class categorical_implications): order_by_points = n + 1.'
- id: cov-boxes-two
  kind: definition
  passage: Axis-parallel boxes, the ranges of the previous subsection, have order two in every dimension.
  rationale: 'Boxes are products of intervals, so by the product lemma their order is that of intervals, two (Danzer et al. 1963, p. 144; Amenta et al. 2017, Theorem 2.2). Recorded: /theory/single_issue_and_products/rows (case grid_boxes): order = 2 on L x L grids.'
- id: cov-grid-levels
  kind: definition
  passage: If each of $d$ quality dimensions is measured on an ordinal scale with at least two levels, the positions form a grid, and a convex commitment admits the grid positions inside a convex region, as linear threshold commitments do ("the mean agreement with items one and two is at least three").
  rationale: 'At least two levels: needed for a unit cell to exist along every axis. Items one and two and the threshold three are an illustrative linear threshold on a five-point scale.'
- id: cov-helly-three
  kind: definition
  passage: Helly's bound of three concerns whether regions share a point of the plane, a possible position.
  rationale: Three is d + 1 for d = 2 (Helly's theorem; claim src-danzer-helly).
- id: cov-thirty-six
  kind: definition
  passage: on a planar map of 30 positions in general position, no check of fewer than six regions at a time can certify all such combinations
  rationale: 'At least six for thirty occupied positions: by Hoffman''s characterization (occupancy paragraph, Section 3.3) the order of convex regions evaluated on a planar point set equals its largest empty convex polygon, and every 30 points in general position contain an empty hexagon (Heule and Scheucher 2024; claim src-heule). The recorded run checks the characterization on 1,300 random maps of 4 to 16 points (/theory/planar), not the 30-point theorem, which is cited.'
- id: cov-fig1-three-levels
  kind: definition
  passage: '(b) Convex commitments: circles are the unit-cell families verified as obstructions on grids with three levels, stars the exhaustive orders of convex sets and boxes on $L\times L$ grids.'
  rationale: 'Three levels: the grids {0, 1, 2}^d used for the unit-cell witnesses, d = 1 to 4 (/theory/witnesses/grid_cube).'
- id: cov-nu
  kind: definition
  passage: A $(k+1)$-ary near-unanimity operation returns $a$ whenever all but at most one of its arguments equal $a$; majority is the ternary case.
  rationale: 'Standard definition (Feder and Vardi''s l-mapping property, claim src-feder-helly-def): the value is a whenever all but at most one argument equal a; majority is k = 2.'
- id: cov-majority-step
  kind: definition
  passage: of three profiles that satisfy a two-literal clause, two satisfy the same one of its literals, and so does their majority
  rationale: 'Pigeonhole: each of three profiles satisfies one of the clause''s two literals, so two satisfy the same one, and the majority takes their common value on that literal''s issue.'
- id: cov-three-members
  kind: definition
  passage: Its obstructions have at least three members.
  rationale: The family is pairwise compatible within X and incompatible, so no obstruction it contains has fewer than three members.
- id: cov-one-background
  kind: definition
  passage: Proposition 4 is the version for one background set of admissible profiles, which is the situation of an atlas.
  rationale: One fixed set X of admissible profiles, against Feder and Vardi's condition on every instance of a constraint language.
- id: cov-background-two
  kind: definition
  passage: the answers $x_1$ and $\neg x_n$ already conflict, an obstruction of two categorical answers
  rationale: 'With the chain as background, x_1 forces x_n, so x_1 and not-x_n are jointly inadmissible while each alone is admissible: an obstruction of two members.'
- id: cov-at-most-two
  kind: definition
  passage: In every case the order of categorical answers is at most two exactly when the set is closed under majority.
  rationale: 'The k = 2 case of Proposition 4 and its converse. Recorded: /theory/background_logic/issues_3/agreements = 255 of 255 and /theory/background_logic/issues_4/agreements = 3,000 of 3,000; all_agree = true.'
- id: cov-one-issue
  kind: definition
  passage: partial profiles on a few issues that satisfy the constraints among them are extended one issue at a time
  rationale: Description of local consistency followed by extension one variable at a time, as in Feder and Vardi's greedy assignment (claim src-feder-helly-thm).
- id: cov-ex-three
  kind: definition
  passage: Two examples on three answers mark the extremes.
  rationale: 'Two examples on three yes/no answers: the even-parity support and the six-profile support in the following sentences.'
- id: cov-ex-xor-eight
  kind: definition
  passage: If the observed profiles are exactly those with an even number of yes answers, the uniform distribution on them and the uniform distribution on all eight profiles have the same pairwise tables, so $\mathcal F(S)$ contains all eight and no pairwise statistic can show that the four odd profiles never occur.
  rationale: All eight profiles = {0,1}^3; the four odd profiles are those with one or three yes answers. Both uniform distributions have every one-way margin 1/2 and every two-way cell 1/4 (claim hull-xor).
- id: cov-ex-six
  kind: definition
  passage: If the observed profiles are the six with one or two yes answers, every pair of answers again occurs and the hull contains all eight, yet the numerical tables exclude 000 and 111.
  rationale: 'Six = 3 + 3 profiles with one or two yes answers; every pair of answers occurs among them, so the hull is all 8 profiles. Recorded: /theory/lp_exhaustive/six_profile_example: support [1, 2, 3, 4, 5, 6], hull of 8 patterns, excluded [0, 7], that is 000 and 111.'
- id: cov-ex-closing
  kind: definition
  passage: By Proposition 6, $\mathcal F(S)$ is therefore $S$ when the unobserved profiles include an even and an odd one, and all eight profiles otherwise.
  rationale: 'All eight profiles = {0,1}^3. Recorded: /theory/lp_exhaustive/issues_3/closed_form_agrees = 255 of 255.'
- id: cov-heading-datasets
  kind: definition
  passage: Higher-order structure in two public datasets
  rationale: 'Two public datasets: the Moral Machine trolley responses (OSF project mxa6z, Awad et al. 2020) and the consciousness-science survey (OSF project xz3ua, Francken et al. 2022), the two sources in simulation/data/MANIFEST.json.'
- id: cov-data-two
  kind: definition
  passage: Two public datasets of individual positions on philosophical questions, both deposited on the Open Science Framework, were used instead.
  rationale: 'Two public datasets: the Moral Machine trolley responses (OSF project mxa6z, Awad et al. 2020) and the consciousness-science survey (OSF project xz3ua, Francken et al. 2022), the two sources in simulation/data/MANIFEST.json.'
- id: cov-trolley-scenarios
  kind: definition
  passage: In Switch, a switch diverts a runaway boxcar onto a side track where it hits one person instead of five; in Loop, the side track loops back and the one person's body stops the boxcar; in Footbridge, a large person can be pushed from a footbridge to stop it.
  rationale: 'Scenario texts as described by Awad et al. (2020, Materials and Methods; claim src-awad-design): one person against five in Switch and Loop, one large person in Footbridge.'
- id: cov-ten-questions
  kind: definition
  passage: Ten of the questions were answered on five-point scales from "definitely yes" to "definitely no".
  rationale: Ten = the 11 position items minus the transition item (POSITION_ITEMS in simulation/fetch_data.py); five-point scales as in Francken et al. (2022).
- id: cov-thirteen
  kind: definition
  passage: Respondents also rated thirteen entities, from a rock and a thermostat to a dog and other people, on whether they are conscious.
  rationale: Thirteen entity columns (ENTITY_ITEMS in simulation/fetch_data.py; the derived file's header).
- id: cov-heading-trolley
  kind: definition
  passage: Three trolley cases
  rationale: 'Three cases: Switch, Loop and Footbridge, as in the data section.'
- id: cov-fig2-a95
  kind: definition
  passage: with 95% bootstrap intervals
  rationale: Percentile intervals (2.5th and 97.5th percentiles) over 2,000 multinomial bootstrap replicates (/trolley/bootstrap/replicates = 2000).
- id: cov-fig2-blue
  kind: definition
  passage: 'Blue lines: one pre-specified triplet tested alone at $\alpha=0.05$, for eight random triplets.'
  rationale: One triplet tested alone against the asymptotic chi-square cut-off at alpha = 0.05 (power_analysis in simulation/atlas/empirical.py); eight = /consciousness/positions/power/triplets = 8.
- id: cov-fig2-red-levels
  kind: definition
  passage: (75 at the two largest sizes, which one of the four planted triplets cannot reach with a positive three-way term, the only direction simulated), with 95% intervals.
  rationale: The planting searched positive strengths only (0 to 8; discovery_power in simulation/atlas/empirical.py). For the fourth planted triplet no searched strength reaches the two largest targets (/consciousness/positions/discovery_power/planted/3/betas ends with two null values), so those levels use 3 x 25 = 75 datasets; the intervals are Wilson score intervals at 95%.
- id: cov-disc-order2
  kind: definition
  passage: A map that records distances or pairwise compatibilities between commitments decides which syntheses are available if and only if its commitment class has order two.
  rationale: Proposition 1 with k = 2, with the Jaccard reading of pairwise compatibility in Section 2.
- id: cov-disc-order2b
  kind: definition
  passage: With order two, pairwise compatibility suffices.
  rationale: Proposition 1 with k = 2.
- id: cov-disc-two-issues
  kind: definition
  passage: yet two issues at a time suffice to refute their obstructions
  rationale: Arc consistency on implication chains (Section 4.2; /theory/witnesses/arc_consistency_chain).
- id: cov-disc-six
  kind: definition
  passage: Whether a combination of regions is held by anyone needs checks of at least six regions at a time on any planar map of thirty positions in general position, while whether it is possible needs checks of three.
  rationale: 'At least six for thirty occupied positions: by Hoffman''s characterization (occupancy paragraph, Section 3.3) the order of convex regions evaluated on a planar point set equals its largest empty convex polygon, and every 30 points in general position contain an empty hexagon (Heule and Scheucher 2024; claim src-heule). The recorded run checks the characterization on 1,300 random maps of 4 to 16 points (/theory/planar), not the 30-point theorem, which is cited. Three is Helly''s d + 1 for the plane.'
- id: cov-disc-two-datasets
  kind: definition
  passage: These are two datasets, one of lay judgments and one of a specialized community, and the binary coding of five-point answers at "probably yes" is a choice that a finer model of ordinal answers could revisit.
  rationale: 'Two datasets: the trolley judgments of lay participants and the survey of consciousness researchers.'
- id: cov-disc-three-times
  kind: interpretation
  passage: while a scan of all triplets would need an effect about three times as strong for 80% power
  rationale: 0.0144 / 0.00489 = 2.94 (/design/philpapers_2020_full_sample/bits_for_80pct_power_bonferroni and /trolley/information/third_order_bits); 80% is the design's power target.
- id: cov-two-files
  kind: definition
  passage: downloads the two source files from the Open Science Framework
  rationale: 'Two files: Shared_data_allResponses.csv (OSF mxa6z) and survey_jasp.csv (OSF xz3ua), the SOURCES of simulation/fetch_data.py.'
- id: cov-jaccard-23
  kind: definition
  passage: while every pair of commitments has Jaccard distance $2/3$ in both families
  rationale: 'Computed exactly with rational arithmetic for every pair in both parity families of 3 to 12 commitments: /theory/parity_pairs/pairwise_jaccard_values = [''2/3''] (constructions.matched_parity_pair). Directly: any two of the commitments, x_i = 0 and x_j = 0 or x_i = 0 and the parity constraint, each admit half of the profiles and share a quarter, so the Jaccard similarity is (1/4)/(3/4) = 1/3 and the distance 2/3.'
- id: cov-zero-148
  kind: definition
  passage: every distribution with the same empty cells gives that pair, and therefore the profile, probability zero
  rationale: 'Proof of Proposition 5: an empty cell of a pairwise table has probability zero under every distribution with the same empty cells, and the profile is contained in the event of its pair of answers, so its probability is at most that of the cell, which is zero.'
- id: cov-zero-152
  kind: definition
  passage: A pairwise function with expectation zero therefore certifies that $z$ is excluded, and the certificate can be checked in exact arithmetic.
  rationale: 'Linear-programming duality of Section 5: for a pairwise f with f(z) >= 1 and f >= 0 on every profile, every distribution with the data''s pairwise tables gives z probability at most E[f] = mu . y, so expectation zero forces p(z) = 0 (Proposition 6). The recorded run checks each such certificate in exact integer arithmetic (certificate in simulation/atlas/lpbounds.py; /theory/lp_exhaustive/issues_4/certificates_verified = certificates_total = 82,176).'
- id: cov-direction
  kind: interpretation
  passage: which one of the four triplets cannot reach with a positive three-way term, the only direction simulated
  rationale: The planting adds beta x_i x_j x_k with beta searched from 0 to 8 only (discovery_power in simulation/atlas/empirical.py); for the fourth triplet (/consciousness/positions/discovery_power/planted/3) the two largest targets have no strength. A separate check of the same fitted model, outside the recorded run, found that the triplet's third-order information levels off at 0.0678 bits for positive strengths up to 80, below 0.08, while negative strengths reach 0.222 bits; the text therefore names the direction.
- id: cov4-abs-three
  kind: definition
  passage: In the judgments of 64,988 participants on three trolley cases, third-order structure carries 2.38% of the multi-information and is stable across countries and designs.
  rationale: 'Binds ''three'': the three trolley cases Switch, Loop and Footbridge, the three answer columns of simulation/data/trolley_first_sessions.csv.'
- id: cov4-triad-two
  kind: definition
  passage: Any two of the three can be held together.
  rationale: 'Binds ''two'' and ''three'': each pair of the three positions A, B and C has a common profile and the three together have none (claim illus-triad).'
- id: cov4-two-readings
  kind: definition
  passage: The last two readings concern joint compatibility, which pairwise data do not record in general.
  rationale: 'Binds ''two'': the readings for unoccupied combinations and for possible syntheses, the last two of the three listed in the preceding sentence.'
- id: cov4-intro-three
  kind: definition
  passage: 'In the judgments of 64,988 participants on three trolley cases [@awad2020], third-order structure is present, stable across countries and design conditions, and small: 2.38% of the multi-information.'
  rationale: 'Binds ''three'': the three trolley cases Switch, Loop and Footbridge.'
- id: cov4-one-condition
  kind: definition
  passage: What this paper adds is the statement of these facts as one condition on maps of positions, short proofs of the orders of the commitment classes such maps use, the occupancy reading of planar maps, the comparison of what the empty cells and the numerical values of pairwise tables exclude, exhaustive verification of the small cases in a recorded run, and the measurement of higher-order structure in public data.
  rationale: 'Binds ''one'': the single condition of Proposition 1, that the obstruction order of the commitment class is at most the number of commitments a map checks at a time.'
- id: cov4-repair-one
  kind: definition
  passage: 'In each of these literatures a repair must remove at least one member of every obstruction: diagnoses are minimal hitting sets of the conflict sets [@reiter1987], and minimal correction sets are minimal hitting sets of the minimal unsatisfiable subsets [@liffiton2008].'
  rationale: 'Binds ''one'': a repair must break every obstruction, so it removes at least one member of each, the hitting-set condition of Reiter (1987) and of Liffiton and Sakallah (2008).'
- id: cov4-jaccard-two
  kind: definition
  passage: For a finite $\Omega$, the Jaccard distance $d_J(A,B)=1-|A\cap B|/|A\cup B|$ between two nonempty commitments is smaller than one exactly when they are compatible.
  rationale: Binds 'two' (the two nonempty commitments A and B, the arguments of the Jaccard distance) and 'one' (the distance equals one exactly when A and B are disjoint).
- id: cov4-two-facts
  kind: definition
  passage: Two further facts make the order a property of the representation, and a computable one.
