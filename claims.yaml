  kind: source
  passage: Differences between models are reported with the corrected resampled variance of Nadeau and Bengio, which allows for the overlap of training sets across folds and repetitions [@nadeau2003].
  evidence:
    citation_id: nadeau2003
    locator: article
    depth: identity
    verified: true
    verification_note: 'Identity checked against Crossref (Machine Learning 52(3):239-281). The journal full text could not be read (publisher PDF requires access). The correction was read in the authors'' conference version, Nadeau and Bengio, Advances in Neural Information Processing Systems 12 (1999), Section 3, ''Corrected Resampled t-Test'': the variance of the cross-validation estimate is estimated by (1/J + n2/n1) times the sample variance of the J fold scores, using the naive correlation n2/(n1 + n2). Independent check (gpt-6-astra, 2026-11-15, fulltext): The 2003 journal identity matches Crossref. Inspected Section 3 of the authors’ 1999 conference version, including the corrected resampled variance. The method is approximate, not an exact coverage guarantee. [Conference version](https://papers.neurips.cc/paper/1999/file/7d12b66d3df6af8d429c1a357d8b9e1a-Paper.pdf).'
- id: src-benjamini
  kind: source
  passage: The triplets of a battery were screened by the step-up procedure of Benjamini and Hochberg at a nominal false discovery rate of 5% [@benjamini1995].
  evidence:
    citation_id: benjamini1995
    locator: abstract
    depth: abstract
    verified: true
    verification_note: 'Abstract read through the OpenAlex record; full text (Wiley) not inspected. The passage attributes the step-up procedure and calls the 5% nominal; it claims no guarantee for the dependent triplet statistics. The procedure is implemented in simulation/atlas/maxent.py (benjamini_hochberg). Independent check (gpt-6-astra, 2026-11-15, abstract): Verified identity and read the abstract in the [Crossref record](https://api.crossref.org/works/10.1111/j.2517-6161.1995.tb02031.x). It supports the procedure’s attribution and the independence-qualified FDR result. The manuscript now describes its application’s level as nominal.'
    quote: A simple sequential Bonferroni-type procedure is proved to control the false discovery rate for independent test statistics
- id: src-by-prds
  kind: source
  passage: The procedure is proved to control that rate for independent tests and for tests with positive regression dependence [@benjamini2001, Theorem 1.2].
  evidence:
    citation_id: benjamini2001
    locator: Theorem 1.2, p. 1168; abstract
    depth: fulltext
    verified: true
    verification_note: 'Read in the published article from the first author''s site (https://www.math.tau.ac.il/~ybenja/MyPapers/benjamini_yekutieli_ANNSTAT2001.pdf, journal pagination). Theorem 1.2: under PRDS on the true nulls the Benjamini-Hochberg procedure controls the FDR at m0 q / m <= q; independence is the case covered by Benjamini and Hochberg (1995), restated in the abstract. Independent check (gpt-6-astra, 2026-11-15, fulltext): Verified Crossref identity and inspected Theorem 1.2, p. 1168, and the independence discussion on p. 1167 of the [author-hosted article](https://www.math.tau.ac.il/~ybenja/MyPapers/benjamini_yekutieli_ANNSTAT2001.pdf). These support the stated independence and PRDS guarantees.'
