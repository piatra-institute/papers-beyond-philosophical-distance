    depth: fulltext
    verified: true
    verification_note: "Hoffman (1979) itself could not be read (closed at Wiley); the statement is quoted from the survey, which attributes it to Proposition 2 of Hoffman's paper. Independent check (gpt-6-astra, 2026-11-15, fulltext): Inspected [Amenta et al., Lemma 2.7](https://arxiv.org/pdf/1508.07606v2), stating Hoffman’s characterization. This checks the cited accessible presentation, not Hoffman’s original chapter."
    quote: 'Lemma 2.7 (Proposition 2 in [Hof79]). If S ⊂ Rᵈ, then h(S) can be computed as the supremum of the numbers h such that the following holds: there exists a set R = {x1, . . . , xh} ⊂ S such that ⋂ conv(R \ {xi}) does not intersect S.'
