    file: simulation/output/results.json
    run_id: analysis
    pointer: /trolley/participants
    reported: 64,988
    decimals: 0
    units: participants
    conditions: Awad et al. (2020) OSF data, one complete session per participant (64,988 participants), answers 1 = sacrifice chosen
