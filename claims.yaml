    citation_id: danzer1963
    locator: p. 144, item (c); notation on p. 128
    depth: fulltext
    verified: true
    verification_note: 'Read in the scan. With the notation of p. 128, gamma_2 = 1 means that every pairwise intersecting finite subfamily has a common point, so boxes have Helly number at most two. Independent check (gpt-6-astra, 2026-11-15, fulltext): Inspected the products and axis-parallel-box discussion on p. 144. It supports the pairwise-intersection property used here. [Danzer et al.](https://www3.nd.edu/~andyp/teaching/2013SpringMath366/DanzerGruenbaumKlee.pdf).'
    quote: If 𝒫ⁿ is the family of all parallelotopes with edges parallel to the coordinate axes in Rⁿ, then γ₂(𝒫ⁿ) = 1.
- id: src-amenta-boxes
  kind: source
