- id: product-lemma
  kind: interpretation
  passage: An obstruction therefore lies on one question, and the order of the class is the largest of the orders $\omega(\mathcal S_q)$.
  rationale: A family of single-question commitments is incompatible iff one question's admitted answer sets have empty intersection; verified for products of exclusion and interval classes in the recorded run (/theory/single_issue_and_products).
- id: horn-bound
  kind: interpretation
  passage: A minimal unsatisfiable Horn set therefore has at most one clause per issue and one negative clause, $n+1$ in all.
  rationale: Forward-chaining argument given in the text; the computed Horn orders equal n + 1 for n = 2 to 5 (/theory/boolean).
- id: parity-bound
  kind: interpretation
  passage: At most $n+1$ points of $\{0,1\}^n$ are affinely independent.
  rationale: Standard linear algebra over GF(2); with the preceding affine-independence argument it gives order n + 1, matched by exhaustive computation for n = 2 to 5.
- id: twolit-bound
  kind: interpretation
  passage: The same holds from $\neg x$ to $x$, so every unsatisfiable set of two-literal clauses has an unsatisfiable subset of at most $2n$ clauses.
  rationale: Path-truncation argument given in the text; the computed orders equal 2n for n = 2 to 5 and the double-cycle families are verified obstructions for n up to 10. The bound is also implied by the classification of Abbasizanjani and Kullmann, credited in the text, and Lee (2009) gives the weaker 4n - 2.
- id: mixture
  kind: interpretation
  passage: The order of a union of classes can exceed the orders of its parts.
  rationale: Categorical answers (order 2) and implications (order 1) give order n + 1, proved by the chain and the Horn bound and computed for n = 2 to 5.
- id: occupancy-lower
  kind: interpretation
  passage: 'One direction is immediate: if $G\subseteq S$ is such a set, the regions $\mathrm{conv}(G\setminus\{g\})$ evaluated on $S$ admit exactly $G\setminus\{g\}$, and the $|G|$ of them form an obstruction.'
  rationale: 'Elementary: G in convex position with no other point of S in its hull; the family''s members omit one point each, so every proper subfamily keeps a point and the whole family none.'
- id: occupancy-30
  kind: interpretation
  passage: Any planar map of 30 occupied positions in general position therefore has order at least six for convex commitments.
  rationale: Combines the lower bound just proved with Heule and Scheucher's theorem that 30 points in general position contain an empty convex hexagon.
- id: occupancy-gap
  kind: interpretation
  passage: A family of regions can share points of the plane and no occupied position, which marks a combination that is possible and unoccupied; on a planar map of 30 positions in general position, no check of fewer than six regions at a time can certify all such combinations.
  rationale: Follows from Proposition 1 applied to the class of convex regions evaluated on the occupied positions, whose order is at least six.
- id: prop4
  kind: interpretation
  passage: '**Proposition 4.** If $X$ is closed under a $(k+1)$-ary near-unanimity operation applied issue by issue, every family of categorical answers that is $k$-wise compatible within $X$ is compatible within $X$. For yes/no issues and $k=2$ the converse holds: if $X$ is not closed under majority, some obstruction consists of at least three categorical answers.'
  rationale: Proved in the text from the Baker-Pixley theorem and the closure of two-literal-clause sets under majority; the k = 2 case is checked exhaustively for three issues and on 3,000 random sets for four (/theory/background_logic).
- id: doctrinal
  kind: interpretation
  passage: 'The discursive dilemma of List and Pettit is the smallest case [@list2002]: with $X$ the profiles that satisfy $r\leftrightarrow(p\wedge q)$, the majority of the admissible profiles $(1,1,1)$, $(1,0,0)$ and $(0,1,0)$ is $(1,1,0)$, which is not admissible, and $\{p,q,\neg r\}$ is an obstruction of three categorical answers.'
  rationale: Direct computation from the definition of X; the discursive dilemma is List and Pettit's (2002) generalization of the doctrinal paradox.
- id: z-order
  kind: interpretation
  passage: The number $z$ is the order of the agenda's categorical answers in the sense used here.
  rationale: Identification of Dietrich and List's z (size of the largest minimally inconsistent subset of the agenda) with the obstruction order of the class of the agenda's propositions relative to the logically possible judgment sets.
- id: locality-differs
  kind: interpretation
  passage: 'The chain of the previous section is an obstruction of $n+1$ commitments, so no check of fewer commitments detects it, yet propagation over pairs of issues refutes it: the fact $x_1$ removes the answer no from $x_2$, and so on, until the commitment $\neg x_n$ leaves $x_n$ without an answer.'
  rationale: Arc consistency on the chain empties a domain for every n from 2 to 10 in the recorded run (/theory/witnesses/arc_consistency_chain).
- id: locality-maps
  kind: interpretation
  passage: A pairwise map of questions, such as a correlation network, and a pairwise map of commitments, such as a distance matrix, therefore answer different questions, and an atlas needs to say which kind of locality it relies on.
  rationale: Consequence of the separation shown by the chain (high commitment order, issue-local refutation) and by parity (non-local in both senses).
- id: finite-duality-step
  kind: interpretation
  passage: If it does, the minimal incompatible families form finitely many patterns up to renaming of issues, which in constraint satisfaction is finite duality; conversely, under finite duality every minimal incompatible family is the image of one of finitely many patterns and so has bounded size.
  rationale: 'The paper''s own short argument: obstructions of bounded size over a finite language are finitely many up to isomorphism, and a critical obstruction is a homomorphic image of a member of any complete set of obstructions.'
- id: prop5
  kind: interpretation
  passage: '**Proposition 5** (the pairwise hull). Let $S\subseteq\{0,1\}^n$ be the set of answer profiles observed in a dataset. The profiles each pair of whose answers occurs together in some observed profile form the smallest set that contains $S$ and is closed under majority. Every distribution with the pairwise marginals of the data assigns probability zero outside this set.'
  rationale: Proved in the text from Baker-Pixley and the closure of two-literal-clause sets under majority; checked on all 255 supports over three issues and 3,000 random supports over four and five issues (/theory/pairwise_hull).
- id: hull-xor
  kind: interpretation
  passage: 'The exclusive-or example is the simplest case: if the observed profiles of three answers are exactly those with an even number of yes answers, every pair of answers occurs, the hull contains all eight profiles, and no pairwise statistic can show that the four odd profiles never occur.'
  rationale: Direct check (tests/test_atlas.py, test_background_logic_and_hull_small and test_ipf_matches_pairwise_margins_and_xor).
- id: mixing
  kind: interpretation
  passage: 'Third-order structure in population data need not reflect anyone''s commitments: a population that mixes groups with different pairwise structures can show higher-order structure that no group shows.'
  rationale: Mixtures of exponential-family distributions leave the family in general; the trolley analysis therefore stratifies by country and design conditions.
- id: assume-endorse
  kind: assumption
  passage: An answer of 1 or 2 counts as endorsement.
  rationale: Binary coding needed for exact maximum-entropy models over all answer patterns; a finer ordinal model could change the measured structure (stated in the discussion).
- id: assume-session
  kind: assumption
  passage: 'The analysis keeps one complete session per participant, the first in the file in which each case was answered once: 64,988 participants.'
  rationale: Avoids repeated participants across training and test folds; rule implemented in simulation/fetch_data.py and recorded in data/MANIFEST.json.
- id: assume-methods
  kind: assumption
  passage: For each battery, maximum-entropy models of order one (independent answers), two and three were fitted with a quadratic penalty chosen by inner cross-validation, and their held-out log-likelihood was compared over five repetitions of ten-fold cross-validation.
  rationale: Nested cross-validation with the penalty grid 0.001-0.3 (simulation/atlas/empirical.py); a different penalty family could change the size of the third-order loss.
- id: assume-null
  kind: assumption
  passage: Each triplet of answers was also tested for third-order structure by the likelihood-ratio statistic of the model without a three-way interaction, with a null distribution simulated from the triplet's marginal under the fitted pairwise model of the whole battery.
  rationale: The marginal of a pairwise model over three items can carry a small three-way term, so the null is simulated from the fitted model; the fitted model is not refitted per simulation.
- id: interp-trolley-shape
  kind: interpretation
  passage: The pairwise model captures that accepting the Footbridge sacrifice goes with accepting the other two; it underestimates how rarely people accept the Footbridge sacrifice while rejecting both others.
  rationale: Reading of the cell ratios for the patterns 001 (0.734) and 111 and of the negative three-way interaction in the recorded results.
- id: interp-unobserved
  kind: interpretation
  passage: Unobserved groups of respondents, for instance inattentive ones, could still contribute to it.
  rationale: Stratification covers countries and design conditions only; latent groups cannot be excluded with these data.
- id: def-joint-avoidance
  kind: definition
  passage: Call a combination of three answers that never occurs, although each of its three pairs of answers does, a joint avoidance; it is the empirical trace of an obstruction of order three inside the pairwise hull.
  rationale: Coined term; computed by atlas/empirical.py joint_avoidances and compared with simulations from the fitted pairwise model.
- id: interp-survey-null
  kind: interpretation
  passage: The survey therefore rules out strong third-order structure among the positions it asks about. It cannot detect structure of the strength present in the trolley judgments.
  rationale: 'Combines the null results with the power analysis: 80% power requires about 0.0194 bits per triplet, the trolley effect is 0.00489 bits and is detected with probability 0.29.'
- id: assume-design
  kind: assumption
  passage: Questions answered by fewer respondents give less power.
  rationale: The design calculation assumes all 1,785 respondents answer the three questions of a triplet; the survey's optional questions have fewer answers.
- id: normative-record
  kind: normative
  passage: With order two, pairwise compatibility suffices. With order $k$, the atlas has to record compatibility of $k$ commitments at a time, or the commitments themselves together with a decision procedure.
  rationale: 'Recommendation derived from Proposition 1: a map that records less than k-wise compatibility for a class of order k cannot decide joint compatibility for all families.'
- id: scope-crisp
  kind: assumption
  passage: 'The theory concerns crisp compatibility: a family of commitments is compatible or not.'
  rationale: All propositions use set-of-models semantics; credences and graded commitments need a different local-to-global theory.
- id: background-vs-commitment
  kind: interpretation
  passage: What counts as background changes the order. With the implications $x_1\to x_2,\dots,x_{n-1}\to x_n$ as background, the answers $x_1$ and $\neg x_n$ already conflict, an obstruction of two categorical answers; when the implications are themselves commitments under examination, every obstruction contains them, and the chain has $n+1$ members.
  rationale: The chain's implications define a majority-closed set X, so by Proposition 4 categorical answers have order at most two within X; as commitments, the chain is the order-(n+1) obstruction of Section 3.2. Both computations are in the recorded run (/theory/boolean and /theory/witnesses).
runs:
- id: analysis
  required: true
