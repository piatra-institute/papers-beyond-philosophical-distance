- id: src-by-any
  kind: source
  passage: Replacing the level $q$ by $q/\sum_{i=1}^{m}1/i$ for $m$ tests would control the rate under any dependence if the p-values were valid [@benjamini2001, Theorem 1.3].
  evidence:
    citation_id: benjamini2001
    locator: Theorem 1.3, p. 1169
    depth: fulltext
    verified: true
    verification_note: "Read in the same copy. Theorem 1.3 replaces q by q / sum_{i=1}^m 1/i in the step-up rule; the statement that the variant rejects only what the step-up procedure rejects is the paper's own consequence of the lower thresholds (the step-up rule rejects the hypotheses up to the largest rank whose p-value is below its threshold). Independent check (gpt-6-astra, 2026-11-15, fulltext): Verified Crossref identity and inspected Theorem 1.3, p. 1169, and the step-up definition on p. 1167 of the [author-hosted article](https://www.math.tau.ac.il/~ybenja/MyPapers/benjamini_yekutieli_ANNSTAT2001.pdf). The harmonic correction supports the conditional claim for valid p-values; it does not establish calibration of this manuscript’s fitted-model p-values."
