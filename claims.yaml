- id: src-danzer-helly
  kind: source
  passage: If positions are points of $\mathbb R^d$ and commitments are convex regions, the order is $d+1$ by Helly's theorem [@helly1923; @danzer1963].
  evidence:
    citation_id: danzer1963
    locator: p. 102
    depth: fulltext
    verified: true
    verification_note: "Read in the scan in Grünbaum's paper archive (University of Washington). The survey states Helly's theorem for finite families or compact members. Independent check (gpt-6-astra, 2026-11-15, fulltext): Inspected the finite-family Helly theorem on p. 102 of the [survey](https://www3.nd.edu/~andyp/teaching/2013SpringMath366/DanzerGruenbaumKlee.pdf). It supplies the d+1 bound; the standard simplex example supplies sharpness."
    quote: HELLY'S THEOREM. Suppose 𝒦 is a family of at least n + 1 convex sets in affine n-space Rⁿ, and 𝒦 is finite or each member of 𝒦 is compact. Then if each n + 1 members of 𝒦 have a common point, there is a point common to all members of 𝒦.
- id: src-averkov-def
  kind: source
  passage: 'This is the Helly number of $\mathcal C$: the least $k$ such that a finite family from $\mathcal C$ is compatible whenever each $k$ of its members are [@danzer1963; @averkov2013].'
  evidence:
    citation_id: averkov2013
    locator: Definition 1.4, p. 2 (arXiv v3)
    depth: fulltext
    verified: true
    verification_note: 'Read in arXiv 1109.6179v3, the preprint of the SIAM article; Definition 1.4 defines the Helly number of a family as the minimal k for which every empty finite intersection has an empty subintersection of k members. Version-of-record pages were not compared. Independent check (gpt-6-astra, 2026-11-15, fulltext): Inspected Definition 1.4 in [Averkov’s preprint](https://arxiv.org/pdf/1109.6179v3). It supports the identification, subject to the manuscript’s explicit convention for obstruction-free classes.'
    quote: then we define h(F) to be the minimal k as above. In all other cases we let h(F) := +∞.
- id: src-averkov-bundling
  kind: source
  passage: For Helly numbers the identity is standard [@averkov2013, eq. 3.1].
  evidence:
    citation_id: averkov2013
    locator: eq. (3.1), p. 5 (arXiv v3)
    depth: fulltext
    verified: true
    verification_note: 'Read in arXiv v3. Equation (3.1) states that a family and the family of its finite intersections have the same Helly number, which is Proposition 2 for atlases. Independent check (gpt-6-astra, 2026-11-15, fulltext): Inspected equation (3.1), stating invariance under taking intersections. [Averkov](https://arxiv.org/pdf/1109.6179v3).'
    quote: 'h(F) = h({F1 ∩ · · · ∩ Ft : t ∈ N, F1, . . . , Ft ∈ F}) (3.1) for every nonempty family F.'
- id: src-danzer-boxes
  kind: source
  passage: A range on an ordinal scale, such as "agrees at least to degree four of five", is an interval of a line; intervals have order two, and so do their products, the axis-parallel boxes [@danzer1963, p. 144; @amenta2017, Theorem 2.2].
